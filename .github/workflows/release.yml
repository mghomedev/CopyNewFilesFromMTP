name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ps2exe
        shell: pwsh
        run: |
          Install-Module -Name ps2exe -Force -Scope CurrentUser

      - name: Stamp version and build date into script
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $buildDate = (Get-Date -Format "yyyy-MM-dd")
          $content = Get-Content "CopyNewFilesFromMTP.ps1" -Raw
          $content = $content -replace '(\$script:AppVersion\s*=\s*)"[^"]*"', "`$1`"$version`""
          $content = $content -replace '(\$script:AppBuildDate\s*=\s*)"[^"]*"', "`$1`"$buildDate`""
          Set-Content "CopyNewFilesFromMTP.ps1" -Value $content -Encoding UTF8

      - name: Build EXE
        shell: pwsh
        run: |
          Invoke-ps2exe -inputFile "CopyNewFilesFromMTP.ps1" `
                        -outputFile "CopyNewFilesFromMTP.exe" `
                        -title "CopyNewFilesFromMTP" `
                        -description "Copy new files from MTP Android device to PC with deduplication" `
                        -version "${{ github.ref_name }}".TrimStart('v') `
                        -noConsole:$false `
                        -requireAdmin:$false

      - name: Create release package
        shell: pwsh
        run: |
          # Create a zip with all files users might need
          Compress-Archive -Path "CopyNewFilesFromMTP.exe", "CopyNewFilesFromMTP.ps1", "CopyNewFilesFromMTP.bat", "README.md" `
                           -DestinationPath "CopyNewFilesFromMTP-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CopyNewFilesFromMTP.exe
            CopyNewFilesFromMTP-${{ github.ref_name }}.zip
